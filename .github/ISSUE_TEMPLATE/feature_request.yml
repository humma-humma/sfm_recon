name: Feature request
description: Propose a scoped reconstruction or engineering improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or workflow problem should be addressed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Acceptance criteria
      description: Describe tests, metrics, or artifacts that would verify it.
    validations:
      required: true
